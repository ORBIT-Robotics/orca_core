hardware:
  port: /dev/ttyUSB0
  baudrate: 3000000
  control_mode: current_based_position
  motor_ids:
    yaw: null
    upper_left: null
    upper_right: null
  startup_current_limit_ma: 180
  runtime_current_limit_ma: 260
  calibration_current_limit_ma: 180
  runtime_rate_hz: 80.0
  command_timeout_sec: 0.75

safety:
  # Virtual (yaw/pitch/roll) command clip before motor mapping.
  virtual_limits_rad:
    yaw: 0.70
    pitch: 0.55
    roll: 0.55
  # Extra margin from discovered motor limits during runtime clipping.
  motor_limit_margin_rad: 0.02
  max_abs_motor_step_rad: 0.08

mapping:
  # Runtime uses neutral-relative command mapping:
  # m_yaw = m_yaw_0 + k_y * yaw
  # m_22  = m_22_0 + k_p * pitch + k_r * roll
  # m_23  = m_23_0 + k_p * pitch - k_r * roll
  yaw_sign: 1.0
  pitch_sign: 1.0
  roll_sign: 1.0

imu:
  backend: pyzed
  serial_number: null
  max_sample_age_sec: 0.25
  sample_attempts: 25
  sample_sleep_sec: 0.01

calibration:
  output_path: orca_core/models/helios_head/calibration.yaml
  log_dir: logs/helios_head_calibration

  tension:
    wiggle_enabled: false
    wiggle_duration_sec: 3.0
    wiggle_step_rad: 0.04
    wiggle_period_sec: 0.10

  limit_search:
    step_size_rad: 0.025
    step_period_sec: 0.02
    stable_window: 10
    stable_threshold_rad: 0.003
    max_steps_per_direction: 800
    current_spike_ma: 700.0
    abort_current_ma: 1000.0

  neutral:
    settle_time_sec: 0.35

  probe:
    settle_time_sec: 0.30
    rest_time_sec: 0.15
    repeats: 3
    yaw_probe_delta_rad: 0.04
    upper_common_probe_delta_rad: 0.03
    upper_diff_probe_delta_rad: 0.03

  validation:
    settle_time_sec: 0.30
    commands_rad:
      yaw: [0.15, -0.15]
      pitch: [0.12, -0.12]
      roll: [0.12, -0.12]
      pitch_roll: [[0.10, 0.08], [-0.10, -0.08]]
