hardware:
  port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTAAMLGV-if00-port0
  baudrate: 3000000
  control_mode: current_based_position
  motor_ids:
    yaw: 21
    pitch: 22
    roll: 23
  startup_current_limit_ma: 300
  runtime_current_limit_ma: 400
  calibration_current_limit_ma: 300
  runtime_rate_hz: 50.0
  command_timeout_sec: 0.75

safety:
  # Virtual (yaw/pitch/roll) command clip before motor mapping.
  virtual_limits_rad:
    yaw: 0.70
    pitch: 0.55
    roll: 0.55
  # Extra margin from discovered motor limits during runtime clipping.
  motor_limit_margin_rad: 0.02
  max_abs_motor_step_rad: 0.16

mapping:
  # Runtime uses neutral-relative command mapping:
  # m_yaw = m_yaw_0 + k_y * yaw
  # m_pitch = m_pitch_0 + k_p * pitch
  # m_roll  = m_roll_0 + k_r * roll
  # A future rotated-frame mode should be represented explicitly as a 3x3
  # virtual-to-motor matrix instead of overloading these direct motor axes.
  yaw_sign: 1.0
  pitch_sign: 1.0
  roll_sign: 1.0

calibration:
  output_path: orca_core/models/helios_head/calibration.yaml
  log_dir: logs/helios_head_calibration
  endpoint_min_ratio: 0.000001

  tension:
    wiggle_enabled: false
    wiggle_duration_sec: 3.0
    wiggle_step_rad: 0.04
    wiggle_period_sec: 0.10

  limit_search:
    step_size_rad: 0.1
    step_period_sec: 0.02
    reverse_direction_settle_sec: 1.0
    stable_window: 10
    stable_threshold_rad: 0.003
    max_steps_per_direction: 800
    current_spike_ma: 300.0
    abort_current_ma: 450.0

  neutral:
    settle_time_sec: 0.35
